<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="570" viewBox="0 0 1100 570" role="img" aria-labelledby="title desc">
<title id="title">Financeiro empresarial da Jacoby</title><desc id="desc">Visão ilustrativa das abas Faturado, Contas a pagar e Contas a receber, com relatório mensal, bancos e centros de custo.</desc>
<rect width="1100" height="570" rx="24" fill="#f1f7f1"/>
<rect x="26" y="26" width="1048" height="518" rx="18" fill="white" stroke="#d6e5d8"/>
<rect x="26" y="26" width="215" height="518" rx="18" fill="#173f2d"/>
<g font-family="Arial,sans-serif"><text x="49" y="75" fill="white" font-size="22" font-weight="700">Jacoby</text><text x="49" y="100" fill="#b9d4c1" font-size="13">CONTROLE EMPRESARIAL</text>
<rect x="41" y="141" width="185" height="41" rx="10" fill="#dcefd8"/><text x="55" y="167" fill="#20562e" font-size="16" font-weight="700">Financeiro</text>
<g fill="#d6e5d8" font-size="15"><text x="59" y="215">Visão financeira</text><text x="59" y="252">Centros de custo</text><text x="59" y="289">Bancos e contas</text></g>
<rect x="49" y="311" width="169" height="37" rx="8" fill="#2e6749"/><text x="59" y="335" fill="white" font-size="15" font-weight="700">Relatórios mensais</text>
<text x="273" y="77" fill="#243c2a" font-size="25" font-weight="700">Seu mês, em uma visão</text><text x="273" y="104" fill="#627568" font-size="14">Entradas, saídas e previsão de caixa da empresa</text>
<g font-size="14"><rect x="273" y="130" width="112" height="35" rx="8" fill="#eaf3e6"/><text x="298" y="153" fill="#28642f">Faturado</text><rect x="396" y="130" width="157" height="35" rx="8" fill="#f8faf7" stroke="#d6e5d8"/><text x="416" y="153" fill="#435b48">Contas a pagar</text><rect x="564" y="130" width="174" height="35" rx="8" fill="#f8faf7" stroke="#d6e5d8"/><text x="583" y="153" fill="#435b48">Contas a receber</text></g>
<rect x="273" y="191" width="766" height="109" rx="12" fill="#eaf4e6" stroke="#c6dfbe"/><text x="294" y="223" fill="#355a34" font-size="15" font-weight="700">Quanto deve sobrar no final do mês?</text><text x="294" y="254" fill="#28642f" font-size="22" font-weight="700">Saldo inicial + entradas − saídas</text><text x="294" y="279" fill="#627568" font-size="13">Valores realizados e previstos, com pendências sinalizadas</text>
<g font-size="14" fill="#35543d"><rect x="273" y="320" width="239" height="69" rx="10" fill="#f8faf7" stroke="#d6e5d8"/><text x="291" y="348">Bancos e contas</text><text x="291" y="370" font-size="12" fill="#627568">Saldo inicial com data de referência</text><rect x="527" y="320" width="245" height="69" rx="10" fill="#f8faf7" stroke="#d6e5d8"/><text x="545" y="348">Recebido e pago</text><text x="545" y="370" font-size="12" fill="#627568">Baixas registradas no mês</text><rect x="787" y="320" width="252" height="69" rx="10" fill="#f8faf7" stroke="#d6e5d8"/><text x="805" y="348">A receber e a pagar</text><text x="805" y="370" font-size="12" fill="#627568">Compromissos em aberto</text></g>
<rect x="273" y="411" width="766" height="91" rx="10" fill="#f8faf7" stroke="#d6e5d8"/><text x="294" y="439" fill="#35543d" font-size="15" font-weight="700">Resultado por centro de custo</text><rect x="294" y="454" width="175" height="28" rx="7" fill="#eaf2ff" stroke="#c6d8f7"/><text x="306" y="473" fill="#254f8a" font-size="12">Centro: Serviços</text><text x="494" y="473" fill="#627568" font-size="13">Receitas · Despesas · Resultado do mês</text>
<text x="273" y="526" fill="#7c8d80" font-size="11">Ilustração das funcionalidades. Nenhum dado financeiro real é exibido.</text></g></svg>
